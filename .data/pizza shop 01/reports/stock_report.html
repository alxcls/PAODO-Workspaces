<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pizza Shop 01 — Live Stock Report</title>
  <style>
    :root {
      --background-color: #ffffff;
      --panel-color: rgba(255, 255, 255, 0.9);
      --accent: #d6411c;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--background-color);
      color: #131313;
      margin: 0;
      padding: 2rem;
    }
    .banner-wrapper {
      margin: -2rem -2rem 1.5rem -2rem;
    }
    .banner {
      display: block;
      width: 100%;
      height: auto;
    }
    section {
      background: var(--panel-color);
      border-radius: 1rem;
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(212, 65, 28, 0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    section:hover {
      transform: translateY(-3px);
      box-shadow: 0 25px 35px rgba(0, 0, 0, 0.1);
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-top: 1rem;
      font-size: 1rem;
    }
    th,
    td {
      padding: 0.8rem 0.5rem;
      text-align: left;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }
    th {
      background: rgba(255, 255, 255, 0.7);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tbody tr:last-child td {
      border-bottom: none;
    }
    tbody tr:hover {
      background: rgba(212, 65, 28, 0.05);
    }
    ul {
      margin: 0;
      padding-left: 1.1rem;
      font-size: 1rem;
      line-height: 1.6;
    }
    .note {
      font-size: 0.95rem;
      color: #5d5d5d;
      margin-top: 0.75rem;
    }
    .alert {
      font-weight: 600;
      color: #d6411c;
    }
    .emoji {
      margin-right: 0.4rem;
    }
  </style>
</head>
<body>
  <div class="banner-wrapper">
    <img src="../img/banner.jpg" alt="Pizza Shop 01 banner" class="banner" />
  </div>
  <section>
    <h2>Ingredient Inventory</h2>
    <p class="note">This report is generated from the live <code>data/ingredients.json</code> file.</p>
    <p class="note" id="status">Loading inventory data…</p>
    <table>
      <thead>
        <tr><th>Ingredient</th><th>Quantity</th></tr>
      </thead>
      <tbody id="inventory-body">
        <tr><td colspan="2">Fetching latest quantities…</td></tr>
      </tbody>
    </table>
  </section>
  <section>
    <h2>Available Pizzas</h2>
    <ul id="pizza-list">
      <li>Calculating availability…</li>
    </ul>
  </section>
  <script>
    const RECIPES = {
      margherita: { dough: 1, tomato_sauce: 1, mozzarella: 200, basil: 3, olive_oil: 10 },
      pepperoni: { dough: 1, tomato_sauce: 1, mozzarella: 250, pepperoni: 15, olive_oil: 10 },
      veggie: { dough: 1, tomato_sauce: 1, mozzarella: 200, mushrooms: 80, bell_pepper: 60, olives: 40, olive_oil: 10 },
    };

    const DATA_URL = new URL('../data/ingredients.json', document.baseURI).href;
    const inventoryBody = document.getElementById('inventory-body');
    const pizzaList = document.getElementById('pizza-list');
    const statusField = document.getElementById('status');

    function formatQuantity(value) {
      if (typeof value !== 'number') {
        return String(value);
      }
      if (Number.isInteger(value)) {
        return value.toString();
      }
      return value.toFixed(2).replace(/\.0+$/g, '').replace(/\.(\d*[1-9])0+$/g, '.$1');
    }

    function buildInventoryRows(inventory) {
      return Object.keys(inventory)
        .sort()
        .map((ingredient) => {
          const item = inventory[ingredient];
          const unit = item?.unit ?? 'units';
          const quantity = item?.quantity ?? 0;
          return `<tr><td>${ingredient}</td><td>${formatQuantity(quantity)} ${unit}</td></tr>`;
        })
        .join('');
    }

    function buildPizzaAvailability(inventory) {
      return Object.keys(RECIPES)
        .sort()
        .map((pizza) => {
          const recipe = RECIPES[pizza];
          const limits = Object.entries(recipe).map(([ingredient, amount]) => {
            const available = inventory[ingredient]?.quantity ?? 0;
            return amount > 0 ? available / amount : Infinity;
          });
          const maxCount = limits.length ? Math.max(0, Math.floor(Math.min(...limits))) : 0;
          const displayName = pizza.charAt(0).toUpperCase() + pizza.slice(1);
          const plural = maxCount === 1 ? '' : 's';
          return `<li>${displayName} — up to ${maxCount} pizza${plural}</li>`;
        })
        .join('');
    }

    function setStatus(message, isError = false) {
      statusField.textContent = message;
      if (isError) {
        statusField.classList.add('alert');
      } else {
        statusField.classList.remove('alert');
      }
    }

    async function refreshReport() {
      try {
        const response = await fetch(`${DATA_URL}?t=${Date.now()}`);
        if (!response.ok) {
          throw new Error(`${response.status} ${response.statusText}`);
        }
        const data = await response.json();
        const inventory = data.inventory || {};
        const rows = buildInventoryRows(inventory);
        inventoryBody.innerHTML = rows || '<tr><td colspan="2">No ingredients available.</td></tr>';
        pizzaList.innerHTML = buildPizzaAvailability(inventory);
        const timestamp = data.last_updated ?? new Date().toISOString();
        setStatus(`Last updated: ${timestamp}`, false);
      } catch (error) {
        inventoryBody.innerHTML = '<tr><td colspan="2">Unable to load inventory.</td></tr>';
        pizzaList.innerHTML = '<li>Unable to determine pizza availability.</li>';
        setStatus(`Error loading inventory: ${error.message}`, true);
        console.error(error);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      refreshReport();
      setInterval(refreshReport, 60_000);
    });
  </script>
</body>
</html>
