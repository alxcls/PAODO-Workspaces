<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pizza Shop — Pizza Activity</title>
  <style>
    :root {
      --accent: #d6411c;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      margin: 0;
      padding: 2rem;
    }
    .banner-wrapper {
      margin: -2rem -2rem 2rem -2rem;
    }
    .banner {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Page header */
    .page-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin: 0 0 0.25rem;
    }
    .page-note {
      font-size: 0.85rem;
      color: #888;
      margin: 0 0 1.5rem;
    }
    #status,
    #stock-status {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 1.5rem;
    }
    #status.alert {
      color: var(--accent);
      font-weight: 600;
    }

    /* Feed */
    .activity-feed {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Pizza card */
    .pizza-card {
      background: #fff;
      border-radius: 0.75rem;
      border: 1px solid #e8e8e8;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid #f0f0f0;
    }
    .card-header .pizza-icon {
      font-size: 1.4rem;
      line-height: 1;
    }
    .card-header .pizza-name {
      font-size: 1rem;
      font-weight: 700;
      text-transform: capitalize;
    }
    .card-header .pizza-meta {
      margin-left: auto;
      font-size: 0.78rem;
      color: #aaa;
      text-align: right;
      white-space: nowrap;
    }

    /* Ingredient table */
    .ing-table {
      width: 100%;
      border-collapse: collapse;
    }
    .ing-table thead tr {
      background: #fafafa;
    }
    .ing-table th {
      padding: 0.45rem 1.25rem;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #bbb;
      text-align: center;
      border-bottom: 1px solid #f0f0f0;
      width: 50%;
    }
    .ing-table td {
      padding: 0.5rem 1.25rem;
      font-size: 0.88rem;
      border-bottom: 1px solid #f5f5f5;
      color: #333;
      text-align: center;
      width: 50%;
    }
    .ing-table tr:last-child td {
      border-bottom: none;
    }
    .ing-table tbody tr:hover {
      background: #fdf5f3;
    }
    .ing-table td.col-qty {
      text-align: center;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .empty-state {
      color: #bbb;
      font-size: 0.9rem;
      padding: 1rem 1.25rem;
    }

    @media (max-width: 600px) {
      body { padding: 1rem; }
      .banner-wrapper { margin: -1rem -1rem 1.5rem -1rem; }
    }
  </style>
</head>
<body>
  <div class="banner-wrapper">
    <img src="../img/banner.jpg" alt="Pizza Shop banner" class="banner" />
  </div>

  <h1 class="page-title">Pizza Activity Log</h1>
  <p id="status">Loading…</p>

  <div class="activity-feed" id="activity-feed"></div>

  <h1 class="page-title" style="margin-top:2rem">Stock Received Log</h1>
  <p id="stock-status"></p>

  <div class="activity-feed" id="stock-feed"></div>

  <script>
    const DATA_URL = new URL('../data/pizza_log.json', document.baseURI).href;
    const STOCK_URL = new URL('../data/stock_log.json', document.baseURI).href;
    const statusEl = document.getElementById('status');
    const stockStatusEl = document.getElementById('stock-status');
    const feed = document.getElementById('activity-feed');
    const stockFeed = document.getElementById('stock-feed');

    function formatTime(value) {
      try {
        return new Date(value).toLocaleString('en-US', {
          month: 'short', day: '2-digit',
          hour: '2-digit', minute: '2-digit', hour12: false,
        });
      } catch { return value; }
    }

    function formatName(raw) {
      return raw.replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase());
    }

    function buildCards(entries) {
      if (!entries.length) return '';

      return entries.map(entry => {
        const ingredients = Object.entries(entry.ingredients_used || {});

        const rows = ingredients.length
          ? ingredients.map(([name, qty]) =>
              `<tr>
                <td class="col-qty">- ${qty}</td>
                <td>${formatName(name)}</td>
              </tr>`).join('')
          : `<tr><td colspan="2" class="empty-state">No ingredients recorded</td></tr>`;

        return `
          <div class="pizza-card">
            <div class="card-header">
              <span class="pizza-icon">🍕</span>
              <span class="pizza-name">${formatName(entry.pizza)}</span>
              <span class="pizza-meta">${entry.chef}<br>${formatTime(entry.timestamp)}</span>
            </div>
            <table class="ing-table">
              <thead>
                <tr>
                  <th class="col-qty">Qty</th>
                  <th>Ingredient</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`;
      }).join('');
    }

    function buildStockCards(entries) {
      if (!entries.length) return '';
      return entries.map(entry => `
        <div class="pizza-card">
          <div class="card-header">
            <span class="pizza-icon">📦</span>
            <span class="pizza-name">${formatName(entry.ingredient)}</span>
            <span class="pizza-meta">${entry.supplier}<br>${formatTime(entry.timestamp)}</span>
          </div>
          <table class="ing-table">
            <thead><tr><th class="col-qty">Qty</th><th>Unit</th></tr></thead>
            <tbody>
              <tr>
                <td class="col-qty">+ ${entry.quantity}</td>
                <td>${entry.unit}</td>
              </tr>
            </tbody>
          </table>
        </div>`).join('');
    }

    async function refresh() {
      try {
        const res = await fetch(`${DATA_URL}?t=${Date.now()}`);
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        const data = await res.json();
        const entries = (data.pizzas_made || []).slice(-12).reverse();
        feed.innerHTML = buildCards(entries);
        statusEl.textContent = `Showing ${entries.length} latest pizza(s)`;
        statusEl.classList.remove('alert');
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
        statusEl.classList.add('alert');
      }
    }

    async function refreshStock() {
      try {
        const res = await fetch(`${STOCK_URL}?t=${Date.now()}`);
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        const data = await res.json();
        const entries = (data.deliveries || []).slice(-12).reverse();
        stockFeed.innerHTML = buildStockCards(entries);
        stockStatusEl.textContent = `Showing ${entries.length} latest received ingredient(s)`;
      } catch (err) {
        console.error('Stock log error:', err.message);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      refresh();
      refreshStock();
      setInterval(refresh, 120_000);
      setInterval(refreshStock, 120_000);
    });
  </script>
</body>
</html>
