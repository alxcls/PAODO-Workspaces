name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Unit tests only — `npm test` excludes the Docker-backed integration tier
      # (vitest.integration.config.ts), keeping CI fast and self-contained.
      # No lint step: `next lint` was removed in Next.js 16, so the package.json
      # "lint" script is currently broken (tracked separately).
      - run: npm test
