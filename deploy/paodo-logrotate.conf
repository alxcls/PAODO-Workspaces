# Installed to /etc/logrotate.d/paodo, so the host's stock daily logrotate.timer picks it up.
# No dedicated unit or timer: repeated warnings are already collapsed in-process (see the dedupe
# hook in lib/infra/logger.ts), so this file cannot grow fast enough to need a sub-daily check.
#
# Only the audit channel is persisted. Operational logs go to stdout and are bounded by the
# json-file driver in docker-compose.yml.
/var/log/paodo/security.log {
    daily
    maxsize 50M
    rotate 14
    missingok
    notifempty
    compress
    # The app holds the log fd open for the life of the process. Renaming the file would leave it
    # writing to the rotated inode forever, so truncate in place instead.
    copytruncate
    nocreate
    # The bind-mounted files use the container's numeric uid/gid, which may not have host account
    # entries. Rotate as root so this policy works on minimal VPS hosts without provisioning them.
    su root root
}
