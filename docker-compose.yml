name: paodo_ws

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      BUILD: 1
      INFO: 1
      EXEC: 1
      POST: 1
    networks:
      - socket_proxy_net
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PORT=${PORT:-3000}
    image: paodo_ws_app
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      - WORKSPACES_VOLUME_NAME=paodo_ws_workspaces
      - WORKSPACES_ROOT=/app/data
    volumes:
      - workspaces:/app/data
    depends_on:
      socket-proxy:
        condition: service_started
    restart: unless-stopped
    # Host-level wall for PAODO's control-plane process. Change these together with the agent and
    # workspace limits to create a repeatable VPS test profile; `docker compose up -d` reapplies it.
    mem_limit: ${APP_MEMORY_LIMIT:-2g}
    cpus: ${APP_CPUS:-2.0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The app forks a host-side `docker` client per exec and per streaming command, so an unbounded
    # burst of concurrent commands is a fork multiplier. Well clear of normal load; a wall, not a quota.
    pids_limit: 1024
    networks:
      - socket_proxy_net
      - app_net
    logging: *default-logging

  # Credential-proxy sidecar. Runs ONLY the proxy (proxyEntry.ts) so the app never has to join a
  # per-workspace network — the app attaches THIS container to each wsnet at runtime, exposing only
  # port 9998 to the sandbox and never the control plane (app:3000 / /ws). It reads the CA + encrypted
  # secret store from the shared volume read-only and shares no IPC with the app. It is deliberately
  # NOT on app_net/socket_proxy_net, so it has no route to the app; `credproxy_net` provides upstream
  # egress. 9998 is never published to the host.
  credproxy:
    image: paodo_ws_app
    container_name: paodo_ws_credproxy
    command: ["npx", "tsx", "proxyEntry.ts"]
    # No env_file: .env here — unlike the app, the sidecar reads only the four vars below (its whole
    # import graph: proxyEntry.ts + lib/infra/{paths,logger}.ts). Inheriting the app's .env would put
    # the admin PASSWORD/USERNAME into the one container the untrusted sandbox can reach, for no
    # functional reason. The secret-store encryption key is read from a FILE
    # (data/.proxy-ca/secrets-enc.key), not env, so dropping .env does not affect decryption.
    #
    # Provider API keys are no longer in .env at all — they live encrypted in data/.provider-keys.json
    # on the volume below, which this sidecar mounts read-only. It never reads that file, but it could:
    # the isolation here is the untrusted SANDBOX containers, which mount only their own workspace
    # subdirectory and so cannot reach any dotted file in the data root. This sidecar is app code.
    environment:
      - WORKSPACES_ROOT=/app/data
      - CREDENTIAL_PROXY_PORT=9998
      # Pin explicitly: without NODE_ENV the logger treats the sidecar as dev and logs at debug.
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - workspaces:/app/data:ro
    depends_on:
      - app
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    networks:
      - credproxy_net
    logging: *default-logging

volumes:
  workspaces:

networks:
  socket_proxy_net:
    internal: true
  app_net: {}
  credproxy_net: {}
