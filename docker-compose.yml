name: paodo_ws

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      BUILD: 1
      INFO: 1
      EXEC: 1
      POST: 1
    networks:
      - socket_proxy_net
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PORT=${PORT:-3000}
    image: paodo_ws_app
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      - WORKSPACES_VOLUME_NAME=paodo_ws_workspaces
      - WORKSPACES_ROOT=/app/data
      - PAODO_PROVIDER_VAULT_ROOT=/app/provider-vault
      - PAODO_PROVIDER_KEY_FILE=/app/provider-key/master.key
      - PAODO_WORKSPACE_SECRET_VAULT_ROOT=/app/workspace-secret-vault
      - PAODO_WORKSPACE_SECRET_KEY_FILE=/app/workspace-secret-key/master.key
    volumes:
      - workspaces:/app/data
      # Its own volume, nested inside /app/data, so credproxy can mount just this directory without
      # a subpath into `workspaces` — Docker requires a subpath to pre-exist, which it does not on a
      # first deployment. The app is the only writer (ensureCA).
      - proxy-ca:/app/data/.proxy-ca
      - provider-vault:/app/provider-vault
      - provider-key:/app/provider-key
      - workspace-secret-vault:/app/workspace-secret-vault
      - workspace-secret-key:/app/workspace-secret-key
    depends_on:
      socket-proxy:
        condition: service_started
    restart: unless-stopped
    # Host-level wall for PAODO's control-plane process. Change these together with the agent and
    # workspace limits to create a repeatable VPS test profile; `docker compose up -d` reapplies it.
    mem_limit: ${APP_MEMORY_LIMIT:-2g}
    cpus: ${APP_CPUS:-2.0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The app forks a host-side `docker` client per exec and per streaming command, so an unbounded
    # burst of concurrent commands is a fork multiplier. Well clear of normal load; a wall, not a quota.
    pids_limit: 1024
    networks:
      - socket_proxy_net
      - app_net
    logging: *default-logging

  # Credential-proxy sidecar. Runs ONLY the proxy (proxyEntry.ts) so the app never has to join a
  # per-workspace network — the app attaches THIS container to each wsnet at runtime, exposing only
  # port 9998 to the sandbox and never the control plane (app:3000 / /ws). It reads the CA,
  # workspace-secret vault and key from separate read-only mounts and shares no IPC with the app.
  # Provider credentials use app-only volumes that are not mounted here.
  # It is deliberately NOT on app_net/socket_proxy_net, so it has no route to the app;
  # `credproxy_net` provides upstream egress. 9998 is never published to the host.
  credproxy:
    build:
      context: .
      dockerfile: Dockerfile.credproxy
    image: paodo_ws_credproxy
    container_name: paodo_ws_credproxy
    # No env_file: .env here. Inheriting the app's .env would put the admin PASSWORD/USERNAME into
    # the one container the untrusted sandbox can reach, for no functional reason. Recoverable
    # workspace secrets live in the encrypted vault below; its key is a file on a different mount.
    # Provider credentials live in two app-only volumes this service cannot access.
    environment:
      - WORKSPACES_ROOT=/app/data
      - PAODO_WORKSPACE_SECRET_VAULT_ROOT=/app/workspace-secret-vault
      - PAODO_WORKSPACE_SECRET_KEY_FILE=/app/workspace-secret-key/master.key
      - CREDENTIAL_PROXY_PORT=9998
      # Pin explicitly: without NODE_ENV the logger treats the sidecar as dev and logs at debug.
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      # Only .proxy-ca (CA, HMAC key, internet-access policy) — NOT the whole workspaces volume,
      # which also holds the conversation database, the registry and every workspace's files. This
      # is the one container the untrusted sandbox can reach, so it gets the two files it reads.
      - proxy-ca:/app/data/.proxy-ca:ro
      - workspace-secret-vault:/app/workspace-secret-vault:ro
      - workspace-secret-key:/app/workspace-secret-key:ro
    depends_on:
      - app
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    networks:
      - credproxy_net
    logging: *default-logging

volumes:
  workspaces:
  proxy-ca:
  provider-vault:
  provider-key:
  workspace-secret-vault:
  workspace-secret-key:

networks:
  socket_proxy_net:
    internal: true
  app_net: {}
  credproxy_net: {}
