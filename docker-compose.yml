name: paodo_ws

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      BUILD: 1
      INFO: 1
      EXEC: 1
      POST: 1
    networks:
      - socket_proxy_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PORT=${PORT:-3000}
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      - SECURITY_LOG_FILE=/logs/security.log
      - WORKSPACES_VOLUME_NAME=paodo_ws_workspaces
      - WORKSPACES_ROOT=/app/data
    volumes:
      - workspaces:/app/data
      - /var/log/paodo:/logs   # host bind mount — security logs survive container wipe
    depends_on:
      - socket-proxy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - socket_proxy_net
      - app_net

volumes:
  workspaces:

networks:
  socket_proxy_net:
    internal: true
  app_net: {}
