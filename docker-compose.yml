name: paodo_ws

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Prepares the bind-mounted log dir. The app and credproxy containers drop ALL capabilities, so
  # they cannot chown a root-owned host directory themselves — without this they crash-loop on
  # EACCES after any host wipe that recreates /var/log/paodo.
  log-init:
    image: paodo_ws_app
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        mkdir -p /logs &&
        touch /logs/security.log &&
        chown 1000:1000 /logs /logs/security.log &&
        chmod 0750 /logs &&
        chmod 0600 /logs/security.log
    volumes:
      - /var/log/paodo:/logs
    restart: "no"
    logging: *default-logging

  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      BUILD: 1
      INFO: 1
      EXEC: 1
      POST: 1
    networks:
      - socket_proxy_net
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PORT=${PORT:-3000}
    image: paodo_ws_app
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      # Only the audit channel is persisted to disk. Operational logs go to stdout, where the
      # json-file driver above bounds them; set OPERATIONAL_LOG_FILE to persist those too.
      - SECURITY_LOG_FILE=/logs/security.log
      - WORKSPACES_VOLUME_NAME=paodo_ws_workspaces
      - WORKSPACES_ROOT=/app/data
    volumes:
      - workspaces:/app/data
      - /var/log/paodo:/logs # host bind mount — security logs survive container wipe
    depends_on:
      log-init:
        condition: service_completed_successfully
      socket-proxy:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - socket_proxy_net
      - app_net
    logging: *default-logging

  # Credential-proxy sidecar. Runs ONLY the proxy (proxyEntry.ts) so the app never has to join a
  # per-workspace network — the app attaches THIS container to each wsnet at runtime, exposing only
  # port 9998 to the sandbox and never the control plane (app:3000 / /ws). It reads the CA + encrypted
  # secret store from the shared volume read-only and shares no IPC with the app. It is deliberately
  # NOT on app_net/socket_proxy_net, so it has no route to the app; `credproxy_net` provides upstream
  # egress. 9998 is never published to the host.
  credproxy:
    image: paodo_ws_app
    container_name: paodo_ws_credproxy
    command: ["npx", "tsx", "proxyEntry.ts"]
    env_file:
      - .env
    environment:
      - WORKSPACES_ROOT=/app/data
      - CREDENTIAL_PROXY_PORT=9998
      # Appends to the same audit file as the app. Log lines are far below PIPE_BUF, so O_APPEND
      # writes from both containers interleave atomically rather than tearing.
      - SECURITY_LOG_FILE=/logs/security.log
    volumes:
      - workspaces:/app/data:ro
      - /var/log/paodo:/logs
    depends_on:
      - app
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - credproxy_net
    logging: *default-logging

volumes:
  workspaces:

networks:
  socket_proxy_net:
    internal: true
  app_net: {}
  credproxy_net: {}
